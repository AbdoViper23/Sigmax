# Sign extension stack — Coston2/Coston/local devnet.
#
# The language of the extension-tee container is selected by LANGUAGE in .env
# (go|python|typescript). start-services.sh maps that into EXTENSION_DOCKERFILE
# before invoking compose. All three Dockerfiles build from this dir and fetch
# tee-node from the network (Go module / git clone) — no on-disk sibling repos.
# The default below preserves the Go path when EXTENSION_DOCKERFILE is unset
# (e.g. when running compose directly).
#
# Usage:
#   docker compose up -d                                                       # local devnet
#   docker compose -f docker-compose.yaml -f docker-compose.coston.yaml up -d  # Coston
#   docker compose -f docker-compose.yaml -f docker-compose.coston2.yaml up -d # Coston2

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_BIND:-127.0.0.1:6382}:6379"
    tmpfs:
      - /data

  ext-proxy:
    image: ${REGISTRY:-local}/tee-proxy
    volumes:
      - ./config/proxy/extension_proxy.docker.toml:/app/config/config.toml:ro
    environment:
      - PROXY_PRIVATE_KEY=${PROXY_PRIVATE_KEY:-983760a4ebf75b2ac3a93531168a0f225d01e5dc6e3568adbd46233ba1fb4fa4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EXT_PROXY_INTERNAL_BIND:-0.0.0.0:6673}:6663"
      - "${EXT_PROXY_EXTERNAL_BIND:-0.0.0.0:6674}:6664"
    depends_on:
      - redis

  extension-tee:
    build:
      context: .
      dockerfile: ${EXTENSION_DOCKERFILE:-Dockerfile}
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}
    env_file:
      - path: ./config/extension.env
        required: false
    environment:
      - MODE=${MODE:-1}
      # Chain id the node binds signatures to — must match the proxy's chain_id
      # and the chain itself. Defaults to Coston2 (114) like the base proxy
      # config; the coston override sets 16. Override via CHAIN_ID in .env.
      - CHAIN_ID=${CHAIN_ID:-114}
      - INITIAL_OWNER=${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}
      # TEE governance the node signs with. Must match what set-governance
      # registers on-chain (post-build reads the same vars). Defaults to the
      # deployer (INITIAL_OWNER) as sole signer, threshold 1; override in .env.
      - GOVERNANCE_SIGNERS=${GOVERNANCE_SIGNERS:-${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}}
      - GOVERNANCE_THRESHOLD=${GOVERNANCE_THRESHOLD:-1}
      - PROXY_URL=http://ext-proxy:6663
      - CONFIG_PORT=5501
      - SIGN_PORT=7701
      - EXTENSION_PORT=7702
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # --- Sigmax SIGNAL/EXECUTE handler ---
      # The enclave reads subscriptions and vault balances itself: it must not trust
      # any caller-supplied follower list, or a caller could redirect a leader's trade
      # into vaults that never subscribed. Left unset, the handler finds no followers
      # and returns an empty (still signed) authorization batch.
      - SIGMAX_RPC_URL=${SIGMAX_RPC_URL:-https://coston2-api.flare.network/ext/C/rpc}
      - SIGMAX_SUBSCRIPTION_REGISTRY=${SIGMAX_SUBSCRIPTION_REGISTRY:-}
      - SIGMAX_VAULT_FACTORY=${SIGMAX_VAULT_FACTORY:-}
      - SIGMAX_ROUTER=${SIGMAX_ROUTER:-}
      - SIGMAX_SUBS_FROM_BLOCK=${SIGMAX_SUBS_FROM_BLOCK:-}
      - SIGMAX_SLIPPAGE_BPS=${SIGMAX_SLIPPAGE_BPS:-}
      # eth_getLogs window for the subscriber scan. Defaults to 30 (the official Coston2 RPC's cap);
      # a provider that allows more means far fewer requests, which is what keeps the scan off 429s.
      - SIGMAX_LOG_WINDOW=${SIGMAX_LOG_WINDOW:-}
      # --- Hyperliquid venue ---
      # The cap defaults to 0, which disables the venue, so these MUST be forwarded or a
      # Hyperliquid signal is rejected inside the enclave no matter what .env says. The
      # enclave reads them once at boot: changing them needs a container restart, which
      # mints a new TEE identity (see docs/flare/RUNBOOK.md §0a).
      - SIGMAX_HL_PER_TRADE_CAP=${SIGMAX_HL_PER_TRADE_CAP:-}
      - SIGMAX_HL_TESTNET=${SIGMAX_HL_TESTNET:-}
      - SIGMAX_HL_MAX_DEVIATION_BPS=${SIGMAX_HL_MAX_DEVIATION_BPS:-}
    # The extension's own HTTP server. `/state` (which reports whether the Hyperliquid agent key is
    # loaded) lives here, NOT on the FCC proxy — the proxy 404s it. Published so the web app's dev
    # proxy and the agent scripts can read it.
    ports:
      - "${EXTENSION_STATE_BIND:-127.0.0.1:7702}:7702"
    depends_on:
      - ext-proxy

networks:
  default:
    name: ${COMPOSE_NETWORK:-sign-default}
