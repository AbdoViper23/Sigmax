[package]
name = "sigmax-enclave"
description = "Sigmax enclave service: decrypts sealed leader signals, sizes each follower's trade and signs vault swap authorizations."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AbdoViper23/Sigmax"
publish = false

[lib]
name = "sigmax_enclave"
path = "src/lib.rs"

[[bin]]
name = "sigmax-enclave"
path = "src/main.rs"

[dependencies]
# Signal decryption: go-ethereum-compatible ECIES over secp256k1, the scheme the
# browser sealer (packages/enclave-crypto) already implements and tests.
k256 = { version = "0.13.4", features = ["ecdh"] }
aes = "0.8.4"
ctr = "0.9.2"
hmac = "0.12.1"
sha2 = "0.10.9"
# Swap authorization signing.
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
zeroize = "1.8"
# Soroban authorization payload (same XDR crate version as soroban-sdk 29).
stellar-xdr = { version = "28.0.0", default-features = false, features = ["std"] }
stellar-strkey = "0.0.16"
ethnum = "1.5.3"
# Service plumbing, kept small on purpose: this code moves into an attested
# confidential VM in Tranche 2, so every dependency is part of the TCB.
tiny_http = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# Interop test: the enclave's authorization runs through the real vault contract.
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
sigmax-types = { path = "../contracts/types" }
sigmax-vault = { path = "../contracts/vault" }
sigmax-signal-registry = { path = "../contracts/signal-registry" }
sigmax-enclave-registry = { path = "../contracts/enclave-registry" }
sigmax-test-mocks = { path = "../contracts/test-mocks" }

[profile.release]
codegen-units = 1
lto = true
