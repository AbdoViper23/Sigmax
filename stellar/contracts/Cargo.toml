[workspace]
resolver = "2"
members = [
  "types",
  "signal-registry",
  "enclave-registry",
  "vault",
  "vault-factory",
  "test-mocks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AbdoViper23/Sigmax"
publish = false

[workspace.dependencies]
soroban-sdk = "29.0.1"
sigmax-types = { path = "types" }
sigmax-signal-registry = { path = "signal-registry" }
sigmax-enclave-registry = { path = "enclave-registry" }
sigmax-test-mocks = { path = "test-mocks" }
# Test-only: sign enclave authorizations the way the enclave service does.
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release, but keeps contract logs for local debugging.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
