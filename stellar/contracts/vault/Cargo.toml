[package]
name = "sigmax-vault"
description = "Sigmax follower vault: a Soroban custom account the enclave can only swap from, inside owner-set limits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
sigmax-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sigmax-signal-registry = { workspace = true }
sigmax-enclave-registry = { workspace = true }
sigmax-test-mocks = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
